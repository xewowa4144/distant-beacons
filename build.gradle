plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "distantbeacons" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional Mod Menu dependency: compile-time only, never bundled.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Optional Voxy API/classes for the shader-specific render pass. Never bundled.
    compileOnly "maven.modrinth:fxxUqruK:LzyXnE51"
}

def modVersion = project.version

processResources {
    inputs.property "version", modVersion

    // The custom shader beam uses Minecraft's built-in white texture.
    // Remove any stale copy of the old local texture directory before Gradle
    // scans the resources, since an old extracted project can retain a
    // malformed directory timestamp that breaks Gradle 9 resource processing.
    doFirst {
        delete(file("src/main/resources/assets/distantbeacons/textures/misc"))
    }

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs.add("-Xlint:deprecation")
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    archiveBaseName = project.archives_base_name
    archiveVersion = ""
}
